name: Version and release

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to recover or republish
        required: true
        type: number

permissions:
  actions: write
  contents: write

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve pull request metadata
        if: github.event_name == 'workflow_dispatch'
        run: |
          pr="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json title,body,state,mergedAt)"

          if [[ "$(jq -r .state <<< "${pr}")" != "MERGED" ]]; then
            echo "Pull request #${PR_NUMBER} is not merged" >&2
            exit 1
          fi

          echo "PR_TITLE_BASE64=$(jq -r .title <<< "${pr}" | base64 -w0)" >> "${GITHUB_ENV}"
          echo "PR_BODY_BASE64=$(jq -r '.body // ""' <<< "${pr}" | base64 -w0)" >> "${GITHUB_ENV}"
      - name: Synchronize main
        run: git pull --ff-only origin main
      - name: Resolve version
        id: version
        run: |
          existing_subject="$(git log --format=%s --fixed-strings --grep="(PR #${PR_NUMBER})" -1)"

          if [[ "${existing_subject}" =~ ^chore:\ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
            changed=false
          else
            version="$(node scripts/bump-version.mjs)"
            changed=true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${VERSION} (PR #${PR_NUMBER})"
          git push origin HEAD:main
      - name: Create tag and GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"

          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}"
            git push origin "${tag}"
          fi

          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target main --generate-notes --title "${tag}"
          fi
      - name: Deploy versioned application
        run: gh workflow run deploy-pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
